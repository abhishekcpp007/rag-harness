[project]
name = "rag-harness"
version = "0.1.0"
description = "A hybrid retrieval service for engineering docs, plus the eval harness that proves it works."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = ["fastembed>=0.4"]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

# Golden set for rag-harness.
#
# kind is only there so the report can slice the score. `identifier` questions are the ones that
# punish a dense-only index. `semantic` questions share almost no vocabulary with the document and
# punish a sparse-only index. `unanswerable` questions have no answer anywhere in the corpus, and
# the only correct behaviour is to abstain.


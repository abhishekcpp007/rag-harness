name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The suite runs on the hash embedder. No model download, so CI stays off the network and
      # the numbers are the same on every machine.
      RAG_EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check rag eval tests
      - run: pytest -q
      - name: eval on the offline backend
        run: |
          python -m eval.run_eval --name ci-hash --embedder hash
          python - <<'PY'
          import json, sys
          s = json.load(open("eval/results/ci-hash.json"))["summary"]
          print(json.dumps(s, indent=2))
          # A floor, not a target. If the hash backend drops below this, retrieval broke.
          assert s["chunk_recall@3"] >= 0.70, s["chunk_recall@3"]
          assert s["abstained_on_answerable"] <= 0.20, s["abstained_on_answerable"]
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the suite, inside the image, with no network at all
        run: |
          docker build --target test -t rag-harness:test .
          docker run --rm --network none rag-harness:test ruff check rag eval tests
          docker run --rm --network none rag-harness:test pytest -q
      - name: the shipped image builds and answers
        run: |
          docker build --target runtime -t rag-harness:runtime .
          docker run -d --name rag -p 8000:8000 rag-harness:runtime
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/answer -H 'content-type: application/json' \
               -d '{"question":"what does NW-4021 mean"}' \
            | python3 -c "import json,sys; a=json.load(sys.stdin); assert not a['abstained'] and a['citations'], a"
          curl -sf -X POST localhost:8000/answer -H 'content-type: application/json' \
               -d '{"question":"how do I issue a virtual card to an employee"}' \
            | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['abstained'], a"
          docker rm -f rag

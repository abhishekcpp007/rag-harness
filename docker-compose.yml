services:
  rag:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      RAG_EMBEDDER: fastembed
      RAG_LLM: extractive
      # Set these and flip RAG_LLM to use a real model instead of the extractive floor.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - rag-index:/data
volumes:
  rag-index:
